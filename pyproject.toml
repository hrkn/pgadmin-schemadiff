[project]
name = "pgadmin-schemadiff-cli"
version = "0.1.0"
description = "CLI and Python library wrapper around pgAdmin 4's Schema Diff engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pglast>=8.9",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[project.scripts]
pgadmin-schemadiff = "pgadmin_schemadiff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgadmin_schemadiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pgadmin_schemadiff"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
